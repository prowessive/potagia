schema_version: 1
name: conduit
description: Engine-neutral relational schema for the RealWorld Conduit application.

conventions:
  naming: snake_case
  identity_generation: database
  timestamp_type: timestamp_with_time_zone
  timestamp_time_zone: UTC
  default_nullable: false
  updated_at_maintenance: application

tables:
  - name: users
    columns:
      - name: id
        type: big_integer
        generated: identity
      - name: username
        type: text
      - name: email
        type: text
      - name: password_hash
        type: text
      - name: bio
        type: text
        nullable: true
      - name: image
        type: text
        nullable: true
    primary_key: [id]
    constraints:
      - name: users_username_unique
        type: unique
        columns: [username]
      - name: users_email_unique
        type: unique
        columns: [email]
      - name: users_username_not_empty
        type: check
        expression: length(username) > 0
      - name: users_email_not_empty
        type: check
        expression: length(email) > 0
      - name: users_password_hash_not_empty
        type: check
        expression: length(password_hash) > 0

  - name: articles
    columns:
      - name: id
        type: big_integer
        generated: identity
      - name: author_id
        type: big_integer
      - name: slug
        type: text
      - name: title
        type: text
      - name: description
        type: text
      - name: body
        type: text
      - name: created_at
        type: timestamp_with_time_zone
        default: current_timestamp
      - name: updated_at
        type: timestamp_with_time_zone
        default: current_timestamp
    primary_key: [id]
    constraints:
      - name: articles_slug_unique
        type: unique
        columns: [slug]
      - name: articles_author_foreign_key
        type: foreign_key
        columns: [author_id]
        references:
          table: users
          columns: [id]
        on_delete: restrict
      - name: articles_slug_not_empty
        type: check
        expression: length(slug) > 0
      - name: articles_title_not_empty
        type: check
        expression: length(title) > 0
      - name: articles_description_not_empty
        type: check
        expression: length(description) > 0
      - name: articles_body_not_empty
        type: check
        expression: length(body) > 0
    indexes:
      - name: articles_created_at_id_index
        columns:
          - column: created_at
            order: descending
          - column: id
            order: descending
      - name: articles_author_created_at_id_index
        columns:
          - column: author_id
            order: ascending
          - column: created_at
            order: descending
          - column: id
            order: descending

  - name: tags
    columns:
      - name: id
        type: big_integer
        generated: identity
      - name: name
        type: text
    primary_key: [id]
    constraints:
      - name: tags_name_unique
        type: unique
        columns: [name]
      - name: tags_name_not_empty
        type: check
        expression: length(name) > 0

  - name: article_tags
    columns:
      - name: article_id
        type: big_integer
      - name: tag_id
        type: big_integer
    primary_key: [article_id, tag_id]
    constraints:
      - name: article_tags_article_foreign_key
        type: foreign_key
        columns: [article_id]
        references:
          table: articles
          columns: [id]
        on_delete: cascade
      - name: article_tags_tag_foreign_key
        type: foreign_key
        columns: [tag_id]
        references:
          table: tags
          columns: [id]
        on_delete: restrict
    indexes:
      - name: article_tags_tag_article_index
        columns:
          - column: tag_id
            order: ascending
          - column: article_id
            order: ascending

  - name: user_follows
    columns:
      - name: follower_id
        type: big_integer
      - name: followed_id
        type: big_integer
    primary_key: [follower_id, followed_id]
    constraints:
      - name: user_follows_follower_foreign_key
        type: foreign_key
        columns: [follower_id]
        references:
          table: users
          columns: [id]
        on_delete: cascade
      - name: user_follows_followed_foreign_key
        type: foreign_key
        columns: [followed_id]
        references:
          table: users
          columns: [id]
        on_delete: cascade
      - name: user_follows_no_self_follow
        type: check
        expression: follower_id <> followed_id
    indexes:
      - name: user_follows_followed_follower_index
        columns:
          - column: followed_id
            order: ascending
          - column: follower_id
            order: ascending

  - name: article_favorites
    columns:
      - name: user_id
        type: big_integer
      - name: article_id
        type: big_integer
    primary_key: [user_id, article_id]
    constraints:
      - name: article_favorites_user_foreign_key
        type: foreign_key
        columns: [user_id]
        references:
          table: users
          columns: [id]
        on_delete: cascade
      - name: article_favorites_article_foreign_key
        type: foreign_key
        columns: [article_id]
        references:
          table: articles
          columns: [id]
        on_delete: cascade
    indexes:
      - name: article_favorites_article_user_index
        columns:
          - column: article_id
            order: ascending
          - column: user_id
            order: ascending

  - name: comments
    columns:
      - name: id
        type: big_integer
        generated: identity
      - name: article_id
        type: big_integer
      - name: author_id
        type: big_integer
      - name: body
        type: text
      - name: created_at
        type: timestamp_with_time_zone
        default: current_timestamp
      - name: updated_at
        type: timestamp_with_time_zone
        default: current_timestamp
    primary_key: [id]
    constraints:
      - name: comments_article_foreign_key
        type: foreign_key
        columns: [article_id]
        references:
          table: articles
          columns: [id]
        on_delete: cascade
      - name: comments_author_foreign_key
        type: foreign_key
        columns: [author_id]
        references:
          table: users
          columns: [id]
        on_delete: restrict
      - name: comments_body_not_empty
        type: check
        expression: length(body) > 0
    indexes:
      - name: comments_article_created_at_id_index
        columns:
          - column: article_id
            order: ascending
          - column: created_at
            order: ascending
          - column: id
            order: ascending

derived_values:
  article_favorites_count: Count rows in article_favorites for the article.
  article_favorited: Check article_favorites for the article and current user.
  profile_following: Check user_follows for the profile and current user.
  personal_feed: Select articles whose author_id appears in user_follows.followed_id for the current follower_id.

application_rules:
  - Store only a password hash produced by a password-hashing algorithm; never store plaintext passwords or expose password_hash through the API.
  - Generate a unique article slug on creation and regenerate it when the title changes, including when titles are duplicated.
  - Validate email format in the application and map uniqueness violations to the API error contract.
  - Set articles.updated_at whenever the article changes. Keep comments.updated_at equal to created_at because comment editing is excluded.
  - Authorize article changes and comment deletion against author_id in the backend.
  - Delete orphaned tags when they are no longer associated with any article if the tag list should contain only available tags.
